<!DOCTYPE html>
<!--
  APON (আপন) PITCH MVP  |  single self-contained file
  Handover notes: see HANDOVER.md in the zip this file came with.
  Structure of this file:
    1. style block: design tokens (:root), components, Bangla-mode rules (html[lang="bn"]), responsive rules
    2. body: static shell: header, language switch, nav, footer (text swapped via data-en / data-bn)
    3. script block: (a) helpers + i18n  (b) seed demo data  (c) scoring logic  (d) screen renderers
                 (e) AI call engine + script  (f) events + init
  Every user-facing string is written as x('English','বাংলা'). Language choice is saved in localStorage.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Apon (আপন): warm AI companion calls for older parents, with gentle insights for their families. Pitch prototype.">
<title>Apon (আপন) | Companion calls for families</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Hind+Siliguri:wght@400;500;600&family=Noto+Serif+Bengali:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --paper:#F8F3EA;
  --paper-deep:#EFE5D3;
  --card:#FFFCF6;
  --green:#2F6B5F;
  --green-deep:#1F4A41;
  --green-ink:#163730;
  --green-soft:#DCE8E1;
  --green-mist:#EAF2ED;
  --sun:#E39B5A;
  --sun-light:#F2C79D;
  --sun-soft:#F8E4CF;
  --sun-ink:#7A441A;
  --ink:#1D2420;
  --ink-2:#4A544E;
  --ink-3:#6F7872;
  --alert:#D66B5A;
  --alert-soft:#F7DDD6;
  --alert-ink:#8E3526;
  --line:rgba(29,36,32,.13);
  --line-2:rgba(29,36,32,.075);
  --serif:'Fraunces','Noto Serif Bengali','Hind Siliguri',Georgia,'Times New Roman',serif;
  --sans:'Manrope','Hind Siliguri',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --bn:'Hind Siliguri','Noto Sans Bengali','Manrope',system-ui,sans-serif;
  --shadow:0 1px 0 rgba(29,36,32,.04),0 22px 44px -28px rgba(92,62,26,.42);
  --shadow-lg:0 40px 70px -34px rgba(58,38,14,.55);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;font-family:var(--sans);font-size:16px;line-height:1.55;color:var(--ink);
  background-color:var(--paper);
  background-image:
    radial-gradient(1000px 540px at 92% -10%,rgba(227,155,90,.20),transparent 62%),
    radial-gradient(760px 620px at -14% 42%,rgba(47,107,95,.085),transparent 62%);
  background-repeat:no-repeat;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36 0 0 0 0 .27 0 0 0 0 .15 0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
::selection{background:var(--sun-light);color:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--sun);outline-offset:3px;border-radius:8px}
[lang="bn"]{font-family:var(--bn)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;flex:none}

/* ---------- Type ---------- */
.display{font-family:var(--serif);font-weight:370;font-size:clamp(2.7rem,5.6vw,5.1rem);line-height:.99;letter-spacing:-.03em;margin:0;text-wrap:balance}
.h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.85rem,3.3vw,2.75rem);line-height:1.07;letter-spacing:-.022em;margin:0;text-wrap:balance}
.h3{font-family:var(--serif);font-weight:500;font-size:1.3rem;line-height:1.2;letter-spacing:-.01em;margin:0}
.kicker{font-size:14.5px;font-weight:600;color:var(--green);margin:0 0 14px}
.lede{font-size:clamp(1.05rem,1.35vw,1.18rem);line-height:1.62;color:var(--ink-2);max-width:34em;margin:20px 0 0}
.small{font-size:14px;line-height:1.5}
.muted{color:var(--ink-3)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 21px;border-radius:999px;border:0;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:background .18s,transform .12s,box-shadow .18s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn .ic{width:18px;height:18px}
.btn.sm{padding:9px 15px;font-size:14px}
.btn-primary{background:var(--green);color:var(--paper)}
.btn-primary:hover{background:var(--green-deep)}
.btn-sun{background:var(--sun);color:var(--ink)}
.btn-sun:hover{background:#EAA96D}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-ghost:hover{box-shadow:inset 0 0 0 1.5px rgba(29,36,32,.35)}
.btn-light{background:rgba(248,243,234,.12);color:var(--paper);box-shadow:inset 0 0 0 1px rgba(255,255,255,.24)}
.btn-light:hover{background:rgba(248,243,234,.2)}
.link{background:none;border:0;padding:0;color:var(--green);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px;font-size:15px}
.link:hover{color:var(--green-deep)}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(248,243,234,.86);-webkit-backdrop-filter:saturate(1.2) blur(12px);backdrop-filter:saturate(1.2) blur(12px);border-bottom:1px solid var(--line-2);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1200px;margin:0 auto;padding:13px 28px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer}
.brand-name{font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:-.025em;line-height:1}
.brand-bn{font-size:17px;color:var(--green);font-weight:500;transform:translateY(2px)}
.tabs{display:flex;gap:2px;margin-left:auto}
@media (max-width:1120px) and (min-width:821px){.who>span:last-child{display:none}.tab{padding:10px 11px}}
.tab{position:relative;background:none;border:0;padding:10px 15px;font-weight:600;font-size:14.5px;color:var(--ink-2);cursor:pointer;border-radius:12px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:50%;bottom:1px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--sun)}
.who{display:flex;align-items:center;gap:10px;font-size:13px;line-height:1.25;color:var(--ink-2);padding-left:18px;border-left:1px solid var(--line)}
.who b{color:var(--ink);font-size:14px}
.who-av{width:34px;height:34px;border-radius:50%;background:var(--sun-soft);color:var(--sun-ink);display:grid;place-items:center;font-weight:800;font-size:14px}

.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(248,243,234,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;font-size:11.5px;font-weight:700;color:var(--ink-3);padding:6px 0;cursor:pointer}
.bnav button .ic{width:22px;height:22px}
.bnav button.on{color:var(--green)}

/* ---------- Layout ---------- */
.wrap{max-width:1200px;margin:0 auto;padding-left:28px;padding-right:28px}
main.wrap{padding-top:34px;padding-bottom:40px}
.view{display:none}
.view.on{display:block;animation:viewIn .35s ease-out}
@keyframes viewIn{from{opacity:0}to{opacity:1}}
.sec{padding:60px 0 8px;border-top:1px solid var(--line);margin-top:48px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 32px;flex-wrap:wrap;margin-bottom:28px}
.sec-head .h2{max-width:22ch}

/* ---------- Home: hero ---------- */
.hero{display:grid;grid-template-columns:1.12fr .88fr;gap:40px;align-items:center;padding:18px 0 10px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.hero-art{position:relative;height:570px}
.hero-blob{position:absolute;inset:5% 1% 3% 9%;background:var(--green-soft);border-radius:58% 42% 54% 46%/47% 56% 44% 53%}
.hero-sun{position:absolute;width:150px;height:150px;border-radius:50%;top:1%;right:5%;background:radial-gradient(circle at 34% 32%,#F5C898,#E39B5A 58%,#D88944)}
.ring-card{position:absolute;left:54%;top:43%;transform:translate(-50%,-50%);width:292px;background:linear-gradient(172deg,#2A6356,#173A33);color:var(--paper);border-radius:36px;padding:28px 24px 26px;box-shadow:var(--shadow-lg);text-align:center}
.ring-k{font-size:13px;opacity:.72;margin:0}
.ring-av{width:94px;height:94px;margin:22px auto 18px;position:relative;display:grid;place-items:center;border-radius:50%;background:var(--paper)}
.ring-av::before,.ring-av::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(242,199,157,.7);animation:ring 2.6s ease-out infinite}
.ring-av::after{animation-delay:1.3s}
@keyframes ring{from{transform:scale(.92);opacity:1}to{transform:scale(1.6);opacity:0}}
.ring-name{font-family:var(--serif);font-size:32px;font-weight:500;line-height:1}
.ring-bn{font-size:17px;color:var(--sun-light);margin-top:5px}
.ring-msg{margin:14px 0 0;font-size:15.5px;opacity:.92}
.ring-actions{display:flex;justify-content:space-between;margin-top:30px;padding:0 12px}
.ring-actions>div{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;opacity:.95}
.round{width:62px;height:62px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:#fff;transition:transform .15s}
.round:hover{transform:scale(1.05)}
.round .ic{width:26px;height:26px}
.round.no{background:var(--alert)}
.round.no .ic{transform:rotate(135deg)}
.round.yes{background:#4E9F86}
.pulse{animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(78,159,134,.65)}50%{box-shadow:0 0 0 15px rgba(78,159,134,0)}}
.note-card{position:absolute;left:0;bottom:0;z-index:2;width:250px;background:var(--card);border-radius:20px 20px 20px 6px;padding:15px 17px;box-shadow:var(--shadow);font-size:13.5px;line-height:1.45;transform:rotate(-2.2deg)}
.note-card b{display:flex;align-items:center;gap:7px;font-size:14px;margin-bottom:4px}
.note-card b .ic{color:var(--green);width:18px;height:18px}

/* ---------- Home: today ---------- */
.today-grid{display:grid;grid-template-columns:1.38fr 1fr;gap:34px;align-items:start}
.ledger{background:var(--card);border-radius:30px;padding:6px 28px;box-shadow:var(--shadow)}
.lrow{display:grid;grid-template-columns:46px 1fr 14px;gap:16px;align-items:center;padding:17px 0;border-bottom:1px solid var(--line-2)}
.lrow:last-child{border-bottom:0}
.lic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--green-mist);color:var(--green)}
.lic.sun{background:var(--sun-soft);color:var(--sun-ink)}
.llabel{font-size:13.5px;color:var(--ink-3);font-weight:600}
.lval{font-family:var(--serif);font-size:1.28rem;font-weight:500;line-height:1.2;margin-top:1px;display:flex;align-items:center;gap:8px}
.lval .ic{color:var(--green);width:19px;height:19px}
.lsub{font-size:14px;color:var(--ink-2);margin-top:2px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);justify-self:end}
.dot.soft{background:var(--sun)}
.dot.warn{background:var(--alert)}
.convo{margin-top:30px;padding-left:4px}
.convo ul{list-style:none;margin:14px 0 0;padding:0}
.convo li{position:relative;padding:8px 0 8px 26px;color:var(--ink-2);font-size:15.5px}
.convo li::before{content:"";position:absolute;left:4px;top:17px;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--sun)}
.action{position:relative;overflow:hidden;background:var(--green-deep);color:var(--paper);border-radius:34px 34px 34px 10px;padding:34px 30px 32px;box-shadow:var(--shadow-lg);margin-top:40px}
.action::after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-80px;bottom:-110px;background:radial-gradient(circle at 40% 35%,#F0B47C,#E39B5A 60%);opacity:.92}
.action>*{position:relative;z-index:1}
.action-k{color:var(--sun-light);font-size:14px;font-weight:600;margin:0}
.action-t{font-family:var(--serif);font-size:clamp(2.1rem,3.4vw,2.8rem);font-weight:400;line-height:1.02;letter-spacing:-.022em;margin:12px 0 14px}
.action-why{color:rgba(248,243,234,.84);max-width:25em;margin:0}
.action-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;max-width:280px}
.action-done{display:flex;align-items:center;gap:10px;margin-top:24px;font-weight:700;color:var(--sun-light)}

.week{display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper-deep);border-radius:28px;padding:8px}
.wk{padding:18px 18px 16px;border-radius:22px}
.wk + .wk{box-shadow:-1px 0 0 rgba(29,36,32,.08)}
.wk-l{font-size:13.5px;font-weight:600;color:var(--ink-3)}
.wk-v{font-family:var(--serif);font-size:1.2rem;font-weight:500;margin:3px 0 12px;display:flex;gap:6px;align-items:baseline}
.wk-v .arr{font-family:var(--sans);font-size:15px;color:var(--sun-ink)}
.wk-v.warn .arr{color:var(--alert-ink)}
.mini{display:flex;gap:4px;align-items:flex-end;height:28px}
.mini i{flex:1;border-radius:3px;background:var(--green);opacity:.72;min-height:3px}
.mini i.soft{background:var(--sun);opacity:.9}

.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;position:relative;counter-reset:f}
.flow::before{content:"";position:absolute;top:23px;left:46px;right:14%;border-top:1.5px dashed rgba(47,107,95,.4)}
.fstep{position:relative}
.fnum{width:46px;height:46px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--green);display:grid;place-items:center;font-family:var(--serif);font-size:19px;color:var(--green);position:relative}
.fstep:nth-child(2) .fnum{background:var(--green);color:var(--paper)}
.fstep:nth-child(3) .fnum{background:var(--sun);box-shadow:none;color:var(--ink)}
.fstep h3{margin:18px 0 8px}
.fstep p{margin:0;color:var(--ink-2);max-width:30ch}

.remember-home{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;background:var(--sun-soft);border-radius:44px 44px 44px 12px;padding:40px 44px}
.quote{font-family:var(--serif);font-style:italic;font-weight:350;font-size:clamp(1.55rem,2.8vw,2.35rem);line-height:1.18;letter-spacing:-.015em;margin:0;max-width:26ch}
.quote-by{margin:14px 0 0;font-size:14.5px;color:var(--sun-ink);font-weight:600}

.foot{padding-top:40px;padding-bottom:60px}
.foot-in{border-top:1px solid var(--line);padding-top:26px;display:flex;justify-content:space-between;gap:20px 40px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-3)}
.foot-in p{margin:0;max-width:62ch}

/* ---------- AI Call ---------- */
.call-top{display:grid;grid-template-columns:1fr auto;gap:24px 40px;align-items:end}
.ctrls{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.ctrl-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.switch{display:inline-flex;align-items:center;gap:11px;background:none;border:0;font-weight:700;font-size:14.5px;cursor:pointer;padding:4px 2px}
.sw{width:42px;height:25px;border-radius:999px;background:rgba(29,36,32,.2);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-pressed="true"] .sw{background:var(--green)}
.switch[aria-pressed="true"] .sw::after{transform:translateX(17px)}
.fbtn{padding:8px 15px;border-radius:999px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:transparent;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink-2)}
.fbtn:hover{color:var(--ink)}
.fbtn.on{background:var(--ink);color:var(--paper);box-shadow:none}
.fbtn:disabled{opacity:.4;cursor:not-allowed}
.call-grid{display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:start;margin-top:34px}
.phone-col{display:flex;flex-direction:column;align-items:center;gap:14px}
.phone{width:352px;height:724px;background:#151917;border-radius:54px;padding:12px;box-shadow:0 44px 80px -34px rgba(46,32,12,.6),inset 0 0 0 1.5px #2C322E;position:relative}
.notch{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:98px;height:27px;border-radius:15px;background:#0E110F;z-index:5}
.screen{height:100%;border-radius:43px;overflow:hidden;background:linear-gradient(172deg,#2A6356 0%,#1C443B 55%,#15342D 100%);color:var(--paper);display:flex;flex-direction:column;position:relative}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:16px 30px 0;font-size:13px;font-weight:700;height:46px;flex:none}
.batt{width:24px;height:12px;border-radius:4px;box-shadow:inset 0 0 0 1.5px rgba(248,243,234,.8);padding:2px;display:flex}
.batt i{flex:0 0 70%;background:var(--paper);border-radius:2px}
.lock{flex:1;display:flex;flex-direction:column;align-items:center;padding:30px 22px 34px;text-align:center}
.lock-time{font-family:var(--serif);font-size:76px;font-weight:300;line-height:1;letter-spacing:-.035em;margin-top:28px}
.lock-date{font-size:14px;opacity:.8;margin-top:8px}
.notif{margin-top:auto;margin-bottom:20px;width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:rgba(248,243,234,.11);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);border-radius:22px;padding:14px}
.notif b{display:block;font-size:14px}
.notif span{font-size:13px;opacity:.8}
.mk{width:42px;height:42px;border-radius:13px;background:var(--paper);display:grid;place-items:center;flex:none}
.incoming{flex:1;display:flex;flex-direction:column;align-items:center;padding:34px 24px 44px;text-align:center}
.incoming .ring-av{width:118px;height:118px;margin:26px auto 24px}
.incoming .ring-name{font-size:38px}
.incoming .ring-actions{margin-top:auto;width:100%;padding:0 20px}
.state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 28px 40px;text-align:center;gap:4px}
.state h3{font-family:var(--serif);font-weight:400;font-size:30px;margin:14px 0 2px;letter-spacing:-.02em}
.state p{margin:6px 0 0;opacity:.85;font-size:14.5px;max-width:26ch}
.state .btns{display:flex;flex-direction:column;gap:10px;margin-top:26px;width:100%;max-width:230px}
.end-ic{width:64px;height:64px;border-radius:50%;background:var(--sun);color:var(--ink);display:grid;place-items:center}
.end-ic .ic{width:30px;height:30px}
.end-ic.miss{background:rgba(214,107,90,.95);color:#fff}
.end-ic.miss .ic{transform:rotate(135deg)}
.chead{display:flex;align-items:center;gap:12px;padding:8px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);flex:none}
.cname{font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.1}
.cname span{font-size:14px;color:var(--sun-light);margin-left:4px}
.cclock{font-size:12.5px;opacity:.75;font-variant-numeric:tabular-nums;margin-top:2px}
.wave{margin-left:auto;display:flex;gap:3px;align-items:center;height:24px}
.wave i{width:3px;height:4px;border-radius:2px;background:var(--sun-light);opacity:.6}
.wave.on i{animation:wv .9s ease-in-out infinite;opacity:1}
.wave.on i:nth-child(2){animation-delay:.12s}.wave.on i:nth-child(3){animation-delay:.24s}.wave.on i:nth-child(4){animation-delay:.36s}.wave.on i:nth-child(5){animation-delay:.18s}.wave.on i:nth-child(6){animation-delay:.3s}
@keyframes wv{0%,100%{height:4px}50%{height:21px}}
.hang{width:36px;height:36px;border-radius:50%;border:0;background:var(--alert);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.hang .ic{width:17px;height:17px;transform:rotate(135deg)}
.caps{flex:1;overflow-y:auto;padding:14px 14px 10px;display:flex;flex-direction:column;gap:9px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.caps-note{font-size:11.5px;text-align:center;opacity:.6;margin:0 10px 4px;line-height:1.4}
.bub{max-width:88%;padding:10px 14px}
.bub.fresh{animation:bub .32s ease-out}
@keyframes bub{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bub .bn{font-size:15.5px;line-height:1.45}
.bub .en{font-size:12px;line-height:1.4;margin-top:3px;opacity:.7}
.bub.ap{align-self:flex-start;background:rgba(248,243,234,.96);color:var(--ink);border-radius:19px 19px 19px 6px}
.bub.us{align-self:flex-end;background:var(--sun-light);color:#2B1B0C;border-radius:19px 19px 6px 19px}
.typing{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;background:rgba(248,243,234,.13);border-radius:16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--paper);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:.9}}
.replies{flex:none;padding:11px 13px 16px;border-top:1px solid rgba(255,255,255,.08);background:rgba(8,22,18,.32);min-height:92px}
.rep-l{font-size:12px;opacity:.72;margin:0 4px 4px;display:flex;justify-content:space-between;gap:10px}
.rep-wait{font-size:13px;opacity:.7;padding:16px 6px;text-align:center}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.07);border:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.17);color:var(--paper);border-radius:16px;padding:9px 13px;margin-top:7px;cursor:pointer;transition:background .15s}
.opt:hover{background:rgba(255,255,255,.14)}
.opt .bn{font-size:14.5px;line-height:1.35}
.opt .en{font-size:11.5px;opacity:.66;margin-top:1px;line-height:1.35}
.opt.picked{background:var(--sun-light);color:#2B1B0C;box-shadow:none}
.phone-note{font-size:13px;color:var(--ink-3);max-width:320px;text-align:center;margin:0}

.pipe{background:var(--card);border-radius:34px;padding:30px 30px 26px;box-shadow:var(--shadow)}
.pipe-head{display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap}
.stages{display:grid;grid-template-columns:repeat(4,1fr);margin:24px 0 22px}
.stg{position:relative;padding-right:12px}
.stg::before{content:"";position:absolute;top:17px;left:36px;right:2px;height:1.5px;background:var(--line)}
.stg:last-child::before{display:none}
.stg-dot{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-family:var(--serif);font-size:15px;background:var(--paper);position:relative;color:var(--ink-3)}
.stg-dot .ic{width:18px;height:18px}
.stg.live .stg-dot{box-shadow:inset 0 0 0 2px var(--sun),0 0 0 5px rgba(227,155,90,.2);background:var(--sun-soft);color:var(--sun-ink)}
.stg.done .stg-dot{background:var(--green);box-shadow:none;color:var(--paper)}
.stg.done::before{background:var(--green)}
.stg-t{font-weight:700;font-size:14px;margin-top:11px;line-height:1.3}
.stg-s{font-size:12.5px;color:var(--ink-3);line-height:1.4;margin-top:3px;padding-right:6px}
.feed-h{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--ink-2);padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.feed{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
.feed li{display:grid;grid-template-columns:118px 1fr 10px;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line-2);font-size:14px}
.feed li.fresh{animation:bub .32s ease-out}
.tag{font-size:12.5px;font-weight:700;color:var(--green)}
.feed .dot{width:8px;height:8px}
.empty{padding:22px 0 8px;color:var(--ink-2);max-width:48ch}
.empty p{margin:0 0 10px}
.cmp{margin-top:22px;background:var(--green-mist);border-radius:22px;padding:18px 20px}
.cmp h4{margin:0 0 8px;font-size:14.5px}
.cmp table{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th{text-align:left;font-weight:600;color:var(--ink-3);padding:6px 8px 6px 0;font-size:12.5px}
.cmp td{padding:7px 8px 7px 0;border-top:1px solid rgba(47,107,95,.13);vertical-align:top}
.cmp td:first-child{font-weight:700}
.working{display:flex;align-items:center;gap:10px;color:var(--green-deep);font-weight:600;font-size:14px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(47,107,95,.25);border-top-color:var(--green);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.prod{display:flex;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line-2);font-size:13.5px;color:var(--ink-2)}
.prod .ic{color:var(--green);margin-top:2px}
.prod p{margin:0}

/* ---------- Pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;padding:5px 11px 5px 9px;border-radius:999px;white-space:nowrap;background:var(--green-mist);color:var(--green-deep)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.pill.soft{background:var(--sun-soft);color:var(--sun-ink)}
.pill.warn{background:var(--alert-soft);color:var(--alert-ink)}

/* ---------- Patient ---------- */
.pt-grid{display:grid;grid-template-columns:370px 1fr;gap:48px;align-items:start}
.portrait{position:sticky;top:96px;background:var(--card);border-radius:38px 38px 38px 12px;padding:32px;box-shadow:var(--shadow)}
.pt-av{width:118px;height:118px;border-radius:58% 42% 54% 46%/47% 56% 44% 53%;background:linear-gradient(150deg,var(--green),var(--green-deep));color:var(--paper);display:grid;place-items:center;font-family:var(--serif);font-size:42px;font-weight:400;position:relative}
.pt-av::after{content:"";position:absolute;width:30px;height:30px;border-radius:50%;background:var(--sun);right:-4px;top:4px}
.pt-name{font-family:var(--serif);font-size:2.3rem;font-weight:400;line-height:1.04;letter-spacing:-.022em;margin:22px 0 4px}
.facts{margin:22px 0 22px;padding:0;list-style:none}
.facts li{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line-2);font-size:14.5px;color:var(--ink-2)}
.facts li .ic{color:var(--green);margin-top:1px}
.facts b{color:var(--ink);font-weight:700}
.block{padding:30px 0;border-bottom:1px solid var(--line)}
.block:first-child{padding-top:4px}
.block:last-child{border-bottom:0}
.block-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.block p{margin:0;color:var(--ink-2);max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 10px 8px 15px;border-radius:999px;background:var(--green-mist);color:var(--green-deep);font-weight:600;font-size:14.5px}
.chip button{width:22px;height:22px;border-radius:50%;border:0;background:rgba(47,107,95,.12);display:grid;place-items:center;cursor:pointer;color:var(--green-deep);padding:0}
.chip button .ic{width:13px;height:13px}
.chip-add{display:flex;gap:8px;margin-top:14px;max-width:420px}
.baseline{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--card);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
.bl{padding:18px 20px;box-shadow:inset -1px -1px 0 var(--line-2)}
.bl-l{font-size:13px;font-weight:700;color:var(--ink-3)}
.bl-v{font-family:var(--serif);font-size:1.35rem;margin:3px 0 2px}
.bl-d{font-size:12.5px;color:var(--ink-3);line-height:1.4}
.consent{display:flex;gap:14px;background:var(--green-mist);border-radius:22px;padding:18px 20px}
.consent .ic{color:var(--green);margin-top:2px}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.input{width:100%;font:inherit;font-size:15px;padding:11px 14px;border-radius:14px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--paper);color:var(--ink)}
textarea.input{resize:vertical;min-height:84px;line-height:1.5}
.input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--green),0 0 0 4px rgba(47,107,95,.13)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--alert-ink);font-size:13.5px;font-weight:600;margin:12px 0 0}
.form-btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}

/* ---------- Memory ---------- */
.remember{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;background:var(--sun-soft);border-radius:46px 46px 46px 12px;padding:36px 42px;margin:30px 0 36px}
.remember-mark{width:92px;height:92px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}
.mtools{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fbtn .n{opacity:.6;margin-left:5px;font-weight:700}
.addpanel{background:var(--card);border-radius:30px;padding:26px 28px;box-shadow:var(--shadow);margin-top:22px}
.addpanel .row2{grid-template-columns:1fr 1fr}
.mgrid{columns:3 290px;column-gap:22px;margin-top:26px}
.mcard{break-inside:avoid;margin:0 0 22px;border-radius:28px;padding:22px 22px 12px;position:relative;background:var(--card);box-shadow:var(--shadow)}
.mcard.story{background:var(--green-deep);color:var(--paper);box-shadow:var(--shadow-lg);border-radius:28px 28px 28px 8px}
.mcard.hobby{background:var(--green-mist);box-shadow:none}
.mcard.routine{background:var(--paper-deep);box-shadow:none}
.mcard.pinned{box-shadow:0 0 0 2.5px var(--sun),var(--shadow)}
.m-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.m-type{font-size:13px;font-weight:700;color:var(--green)}
.story .m-type{color:var(--sun-light)}
.m-title{font-family:var(--serif);font-size:1.5rem;font-weight:500;line-height:1.12;letter-spacing:-.015em;margin:6px 0 8px}
.family .m-title{font-size:1.75rem}
.m-detail{margin:0;font-size:15px;color:var(--ink-2)}
.story .m-detail{font-family:var(--serif);font-style:italic;font-size:1.12rem;line-height:1.45;color:rgba(248,243,234,.92)}
.m-av{width:44px;height:44px;border-radius:50%;background:var(--sun-soft);color:var(--sun-ink);display:grid;place-items:center;font-family:var(--serif);font-size:19px;flex:none}
.m-icon{width:44px;height:44px;border-radius:14px;background:var(--card);color:var(--green);display:grid;place-items:center;flex:none}
.story .m-icon{background:rgba(248,243,234,.12);color:var(--sun-light)}
.m-starter{margin:12px 0 0;font-size:14px;padding:10px 12px;border-radius:14px;background:rgba(47,107,95,.07);color:var(--ink-2)}
.story .m-starter{background:rgba(248,243,234,.1);color:rgba(248,243,234,.85)}
.m-gentle{margin:12px 0 0;font-size:13.5px;color:var(--sun-ink);font-weight:600}
.mfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:6px;border-top:1px solid var(--line-2);gap:10px}
.story .mfoot{border-color:rgba(255,255,255,.13)}
.m-by{font-size:12.5px;color:var(--ink-3)}
.story .m-by{color:rgba(248,243,234,.6)}
.pinbtn{display:inline-flex;gap:6px;align-items:center;background:none;border:0;font-size:13.5px;font-weight:700;color:var(--green);cursor:pointer;padding:8px 0}
.pinbtn .ic{width:16px;height:16px}
.story .pinbtn{color:var(--sun-light)}
.pinned .pinbtn{color:var(--sun-ink)}
.story.pinned .pinbtn{color:var(--sun-light)}
.delbtn{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--ink-3);display:grid;place-items:center;cursor:pointer}
.delbtn:hover{background:rgba(29,36,32,.07);color:var(--alert-ink)}
.story .delbtn{color:rgba(248,243,234,.6)}
.story .delbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.delbtn .ic{width:17px;height:17px}
.flag{display:inline-block;font-size:12px;font-weight:800;background:var(--sun);color:var(--ink);padding:3px 9px;border-radius:999px;margin-bottom:10px}
.m-empty{padding:40px 0;color:var(--ink-2)}

/* ---------- Insights ---------- */
.ins-top{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:end}
.recall{background:var(--green-deep);color:var(--paper);border-radius:34px 34px 10px 34px;padding:28px 30px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.recall::after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:var(--sun);right:-38px;top:-42px;opacity:.9}
.recall>*{position:relative;z-index:1}
.recall-k{font-size:14px;font-weight:600;color:var(--sun-light);margin:0}
.recall-n{font-family:var(--serif);font-size:4.4rem;line-height:1;font-weight:330;letter-spacing:-.04em;margin:14px 0 4px}
.recall-n span{font-size:1.6rem;opacity:.75;letter-spacing:0}
.recall p{margin:0;font-size:14px;color:rgba(248,243,234,.82)}
.recall .pill{margin-top:16px}
.mgroup{margin-top:52px}
.mgroup>.h3{margin-bottom:6px}
.mrow{display:grid;grid-template-columns:minmax(170px,1.1fr) minmax(190px,230px) minmax(150px,1fr) 150px;gap:24px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line-2)}
.mname{font-weight:700;font-size:15.5px}
.mdesc{font-size:13.5px;color:var(--ink-3);line-height:1.4;margin-top:2px}
.bars{position:relative;display:flex;gap:6px;align-items:flex-end;height:46px}
.bars i{flex:1;border-radius:5px 5px 2px 2px;background:var(--green);opacity:.78;min-height:3px}
.bars i.soft{background:var(--sun);opacity:.95}
.bars i.today{opacity:1;box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink)}
.bars .base{position:absolute;left:-4px;right:-4px;border-top:1.5px dashed rgba(29,36,32,.45);pointer-events:none}
.dlabels{display:flex;gap:6px;font-size:10.5px;color:var(--ink-3);margin-top:5px}
.dlabels span{flex:1;text-align:center}
.mvals{font-size:14px;color:var(--ink-2);line-height:1.5}
.mvals b{font-family:var(--serif);font-weight:500;font-size:1.1rem;color:var(--ink)}
.mstat{justify-self:end}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:52px}
.panel{background:var(--card);border-radius:30px;padding:26px 28px;box-shadow:var(--shadow)}
.alerts{list-style:none;margin:14px 0 0;padding:0}
.alerts li{display:grid;grid-template-columns:12px 1fr;gap:14px;padding:13px 0;border-top:1px solid var(--line-2);font-size:15px;color:var(--ink-2)}
.alerts li .dot{margin-top:7px}
.acts{list-style:none;margin:14px 0 0;padding:0;counter-reset:a}
.acts li{display:grid;grid-template-columns:34px 1fr;gap:14px;padding:13px 0;border-top:1px solid var(--line-2)}
.acts li::before{counter-increment:a;content:counter(a);width:30px;height:30px;border-radius:50%;background:var(--sun-soft);color:var(--sun-ink);display:grid;place-items:center;font-family:var(--serif);font-size:15px}
.acts b{display:block;font-size:15.5px}
.acts span{font-size:14px;color:var(--ink-2)}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:40px;padding:24px 0 0;border-top:1px solid var(--line)}
.legend p{margin:10px 0 0;font-size:14px;color:var(--ink-2)}
.nodx{margin-top:30px;display:flex;gap:14px;align-items:flex-start;font-size:14px;color:var(--ink-2);max-width:74ch}
.nodx .ic{color:var(--green);margin-top:2px}
.nodx p{margin:0}


/* ---------- Language switch ---------- */
.lang{display:inline-flex;align-items:center;background:var(--paper-deep);border-radius:999px;padding:3px;gap:2px;flex:none}
.lang button{border:0;background:transparent;border-radius:999px;padding:7px 13px;font-weight:700;font-size:13.5px;color:var(--ink-2);cursor:pointer;line-height:1.2}
.lang button[lang="bn"]{font-size:14.5px;padding:6px 13px 8px}
.lang button.on{background:var(--ink);color:var(--paper)}
.lang-ic{display:grid;place-items:center;width:30px;color:var(--green)}
.lang-ic .ic{width:18px;height:18px}

/* ---------- Bangla mode: Bengali script needs more line-height and no negative tracking ---------- */
html[lang="bn"] body{line-height:1.72}
html[lang="bn"] .display{letter-spacing:0;line-height:1.24;font-size:clamp(2.3rem,4.7vw,4.3rem);font-weight:500}
html[lang="bn"] .h2{letter-spacing:0;line-height:1.32;font-weight:500}
html[lang="bn"] .h3,html[lang="bn"] .action-t,html[lang="bn"] .pt-name,html[lang="bn"] .m-title,html[lang="bn"] .lval,
html[lang="bn"] .ring-name,html[lang="bn"] .wk-v,html[lang="bn"] .bl-v,html[lang="bn"] .state h3,html[lang="bn"] .cname{letter-spacing:0;line-height:1.36}
html[lang="bn"] .quote,html[lang="bn"] .story .m-detail{font-style:normal;letter-spacing:0;line-height:1.5}
html[lang="bn"] .action-t{font-size:clamp(1.8rem,3vw,2.4rem)}
html[lang="bn"] .lede{line-height:1.8}
html[lang="bn"] .btn{white-space:normal;text-align:center}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:12px 14px 12px 18px;border-radius:16px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:100;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 20px 40px -18px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:var(--sun);color:var(--ink);border:0;border-radius:10px;padding:6px 12px;font-weight:800;cursor:pointer}

/* ---------- Responsive ---------- */
@media (max-width:1040px){
  .hero{grid-template-columns:1fr;gap:10px}
  .hero-art{height:560px;max-width:560px;width:100%;margin:0 auto}
  .today-grid{grid-template-columns:1fr}
  .action{margin-top:0}
  .call-grid{grid-template-columns:1fr}
  .call-top{grid-template-columns:1fr}
  .pt-grid{grid-template-columns:1fr;gap:34px}
  .portrait{position:static}
  .ins-top{grid-template-columns:1fr}
  .mrow{grid-template-columns:1fr auto;gap:12px 20px}
  .mrow .bars-wrap{grid-column:1/-1;order:3}
  .mrow .mvals{order:4;grid-column:1/-1}
  .two{grid-template-columns:1fr}
  .week{grid-template-columns:repeat(3,1fr)}
  .wk:nth-child(4){box-shadow:none}
}
@media (max-width:820px){
  .tabs,.who{display:none}
  .top-in{padding:10px 16px;gap:12px}
  .lang{margin-left:auto}
  .lang-ic{display:none}
  .bnav{display:flex}
  main.wrap{padding-bottom:40px}
  .foot{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .flow{grid-template-columns:1fr;gap:26px}
  .flow::before{top:46px;bottom:40px;left:23px;right:auto;border-top:0;border-left:1.5px dashed rgba(47,107,95,.4)}
  .fstep{display:grid;grid-template-columns:46px 1fr;gap:0 18px}
  .fstep h3{margin:10px 0 6px}
  .fstep>div{grid-column:2}
  .fnum{grid-row:1/3}
  .remember-home{grid-template-columns:1fr;padding:32px 28px}
  .remember{grid-template-columns:1fr;padding:30px 26px;gap:18px}
  .legend{grid-template-columns:1fr}
  .baseline{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  .wrap{padding-left:18px;padding-right:18px}
  .hero-art{height:545px}
  .ring-card{width:268px;left:50%;top:41%}
  .note-card{width:220px;bottom:0}
  .hero-sun{width:110px;height:110px}
  .ledger{padding:4px 18px}
  .lrow{grid-template-columns:40px 1fr 12px;gap:12px}
  .lic{width:40px;height:40px;border-radius:13px}
  .week{grid-template-columns:repeat(2,1fr)}
  .wk{box-shadow:none!important}
  .phone{width:100%;max-width:352px;height:680px;border-radius:48px}
  .screen{border-radius:37px}
  .stages{grid-template-columns:repeat(2,1fr);gap:18px 0}
  .stg:nth-child(2)::before{display:none}
  .pipe{padding:24px 20px}
  .feed li{grid-template-columns:96px 1fr 8px;gap:10px}
  .row2,.addpanel .row2{grid-template-columns:1fr}

  try{

    if(raw){ var d = JSON.parse(raw); if(d && d.v===2 && d.profile && d.history && d.history.length===7) return d; }
  }catch(e){}
  return seed();
}

  var t=T(), W=weekly(), labels=dayLabels(), sd=shortDays(), mem=wk(W,'memory');
  function row(q){

/* ---------- AI CALL: engine state ---------- */
var Call = {state:'idle',steps:[],i:0,msgs:[],seen:0,feed:[],feedSeen:0,sig:{},hl:[],sec:0,shown:0,tick:null,to:[],
  auto:false,scen:0,speaking:false,thinking:false,awaiting:false,pipe:0,result:null,memUsed:null};
function later(fn,ms){ var id=setTimeout(fn,ms); Call.to.push(id); return id; }
function clearCall(){ Call.to.forEach(clearTimeout); Call.to=[]; if(Call.tick){clearInterval(Call.tick);Call.tick=null;} }
function freshCall(state){
  clearCall();
  Call.state=state; Call.steps=[]; Call.i=0; Call.msgs=[]; Call.seen=0; Call.feed=[]; Call.feedSeen=0; Call.sig={}; Call.hl=[];
  Call.sec=0; Call.shown=0; Call.speaking=false; Call.thinking=false; Call.awaiting=false; Call.pipe=0; Call.result=null; Call.memUsed=null;
}
function ring(){ freshCall('ringing'); renderPhone(); renderPipeline(); if(Call.auto) later(answer,2400); }
function decline(){ freshCall('declined'); renderPhone(); renderPipeline(); }
function hangup(){ freshCall('idle'); renderPhone(); renderPipeline(); toast(x('Call ended early. Nothing was saved to the report.','কল আগেই শেষ হয়েছে। রিপোর্টে কিছু সংরক্ষণ হয়নি।')); }
function answer(){
  freshCall('active');
  Call.steps=buildSteps(); Call.pipe=1;
  Call.tick=setInterval(function(){
    if(Call.shown<Call.sec){ Call.shown=Math.min(Call.sec,Call.shown+3); var el=$('#cclock'); if(el) el.textContent=fmtClock(Call.shown); }
  },120);
  renderPhone(); renderPipeline();
  later(function(){ addFeed(['Call','Call answered, speaking Bangla','ok','কল ধরেছেন, বাংলায় কথা হচ্ছে']); nextStep(); },500);
}
function nextStep(){
  while(Call.i<Call.steps.length && Call.steps[Call.i].cond && !Call.steps[Call.i].cond(Call.sig)) Call.i++;
  if(Call.i>=Call.steps.length){ endCall(); return; }
  var st=Call.steps[Call.i];
  speak({bn:st.bn,en:st.en},function(){
    if(st.onAsk) addFeed(st.onAsk);
    if(st.mem) Call.memUsed=st.mem.title;
    Call.awaiting=true; renderReplies();
    if(Call.auto) later(pickAuto,1700);
  });
}
function speak(line,cb){
  Call.thinking=true; renderCaps(); renderReplies();
  later(function(){
    Call.thinking=false; Call.speaking=true;
    Call.msgs.push({who:'ap',bn:line.bn,en:line.en});
    Call.sec += Math.round(8+line.bn.length*0.25);
    renderCaps(); renderReplies(); setWave(true);
    var ms=Math.min(2600,Math.max(1000,500+line.bn.length*22));
    later(function(){ Call.speaking=false; setWave(false); if(cb) cb(); },ms);
  },450);
}
function reply(idx){
  if(!Call.awaiting || Call.state!=='active') return;
  var st=Call.steps[Call.i], o=st&&st.opts[idx]; if(!o) return;
  Call.awaiting=false;
  Call.msgs.push({who:'us',bn:o.bn,en:o.en});
  Call.sec += (o.sec||10);
  var sig=o.sig||{};
  Object.keys(sig).forEach(function(k){ if(k==='repeat'||k==='wf') Call.sig[k]=(Call.sig[k]||0)+sig[k]; else Call.sig[k]=sig[k]; });
  if(o.hl) Call.hl.push(o.hl);
  renderCaps(); renderReplies();
  (o.feed||[]).forEach(function(f,j){ later(function(){addFeed(f);},300+j*320); });
  Call.i++;
  var go=function(){ later(nextStep,600); };
  if(o.ack) later(function(){ speak(o.ack,go); },650); else go();
}
function pickAuto(){
  if(!Call.awaiting) return;
  var st=Call.steps[Call.i]; var idx=Math.min(Call.scen, st.opts.length-1);
  var b=$('#replies .opt[data-i="'+idx+'"]'); if(b) b.classList.add('picked');
  later(function(){ reply(idx); },450);
}
function addFeed(f){ Call.feed.push({cat:f[0],en:f[1],tone:f[2]||'ok',bn:f[3]||f[1]}); renderPipeline(); }
function compile(){
  var g=Call.sig;
  function has(k){ return g[k]!==undefined; }
  var words = has('words')?g.words:3;
  var memory = has('personal') ? words+g.personal : Math.round(words*5/3*10)/10;
  var hl = Call.hl.slice().sort(function(p,q){return p[0]-q[0];}).map(function(h){return {en:h[1],bn:h[2]||h[1]};}).slice(0,3);
  return {
    mood: has('mood')?g.mood:4, sleep: has('sleep')?g.sleep:2, breakfast: has('breakfast')?g.breakfast:1,
    social: has('social')?g.social:1, memory:memory, orient: has('orient')?g.orient:1,
    attention: Math.max(0,2-(g.repeat||0)), language: Math.max(0,2-(g.wf||0)),
    duration: Math.round(Call.sec/6)/10, time: nowHHMM(), lonely: !!g.lonely,
    wantsCall: has('wantsCall')?g.wantsCall:null, memUsed: Call.memUsed,
    highlights: hl.length?hl:[{en:'Had a warm chat with Apon.',bn:'আপনের সাথে আন্তরিক আলাপ হয়েছে।'}]
  };
}
function endCall(){
  Call.awaiting=false; Call.state='ending';
  Call.result=compile();
  renderReplies();
  later(function(){ Call.pipe=2; renderPipeline(); },300);
  later(function(){ if(Call.tick){clearInterval(Call.tick);Call.tick=null;} Call.shown=Call.sec; Call.state='ended'; renderPhone(); },1300);
  later(function(){
    S.history[S.history.length-1]=Call.result; S.done=false; save();
    Call.pipe=3; addFeed(['Report','Summary sent to '+S.profile.caregiver,'ok',obj(S.profile.caregiverBn||S.profile.caregiver)+' সারসংক্ষেপ পাঠানো হয়েছে']);
    renderHome(); renderInsights();
    toast(x('Today\u2019s report is updated for '+S.profile.caregiver+'.', poss(cg())+' জন্য আজকের রিপোর্ট হালনাগাদ হয়েছে।'));
  },2300);
}

      '<div class="btns"><button class="btn btn-sun" data-action="see-report">'+x('See today\u2019s report','আজকের রিপোর্ট দেখুন')+'</button><button class="btn btn-light" data-action="ring">'+x('Call again','আবার কল করুন')+'</button></div></div>';
  } else {
    h=bar+'<div class="chead"><div class="mk" style="width:40px;height:40px;border-radius:50%">'+mark(28)+'</div>'+
      '<div><div class="cname">'+x('Apon<span lang="bn">আপন</span>','আপন<span>Apon</span>')+'</div><div class="cclock" id="cclock">'+fmtClock(Call.shown)+'</div></div>'+
      '<div class="wave" id="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>'+
      '<button class="hang" data-action="hangup" aria-label="'+x('End call','কল শেষ করুন')+'">'+icon('phone')+'</button></div>'+
      '<div class="caps" id="caps" aria-live="polite"></div><div class="replies" id="replies"></div>';
  }
  el.innerHTML=h;
  if(Call.state==='active'||Call.state==='ending'){ Call.seen=0; renderCaps(); renderReplies(); setWave(Call.speaking); }
}
function renderCaps(){
  var c=$('#caps'); if(!c) return; var t=T(), showEn=LANG!=='bn';
  var html='<p class="caps-note">'+x('Captions for the demo. '+esc(t.en)+' simply hears a friendly voice.','ডেমোর জন্য লেখা দেখানো হচ্ছে। '+esc(t.bn)+' শুধু একটি আপন কণ্ঠ শোনেন।')+'</p>';
  html+=Call.msgs.map(function(m,i){
    return '<div class="bub '+m.who+(i>=Call.seen?' fresh':'')+'"><div class="bn" lang="bn">'+esc(m.bn)+'</div>'+(showEn&&m.en?'<div class="en">'+esc(m.en)+'</div>':'')+'</div>';
  }).join('');
  if(Call.thinking) html+='<div class="typing" aria-label="'+x('Apon is listening','আপন শুনছে')+'"><i></i><i></i><i></i></div>';
  c.innerHTML=html; Call.seen=Call.msgs.length; c.scrollTop=c.scrollHeight;
}
function renderReplies(){
  var r=$('#replies'); if(!r) return; var t=T(), showEn=LANG!=='bn';
  if(Call.state==='ending'){ r.innerHTML='<div class="rep-wait">'+x('Call ending. Writing '+esc(cg())+'\u2019s summary\u2026','কল শেষ হচ্ছে। '+esc(poss(cg()))+' জন্য সারসংক্ষেপ লেখা হচ্ছে\u2026')+'</div>'; return; }
  if(Call.state!=='active') { r.innerHTML=''; return; }
  if(!Call.awaiting){ r.innerHTML='<div class="rep-wait">'+(Call.speaking?x('Apon is speaking','আপন কথা বলছে'):x('Listening','শুনছে'))+'\u2026</div>'; return; }
  var st=Call.steps[Call.i];
  var lbl = Call.auto ? x('Auto-playing a '+SCEN[Call.scen][0].toLowerCase(),'অটো-প্লে: '+SCEN[Call.scen][1]) : x('Choose '+esc(t.en)+'\u2019s reply', esc(poss(t.bn))+' উত্তর বেছে নিন');
  r.innerHTML='<div class="rep-l"><span>'+lbl+'</span><span>'+esc(x(st.stage,STAGE_BN[st.stage]||st.stage))+'</span></div>'+
    st.opts.map(function(o,i){ return '<button class="opt" data-action="reply" data-i="'+i+'"><div class="bn" lang="bn">'+esc(o.bn)+'</div>'+(showEn?'<div class="en">'+esc(o.en)+'</div>':'')+'</button>'; }).join('');
}
function setWave(on){ var w=$('#wave'); if(w) w.classList.toggle('on',!!on); }

function renderPipeline(){
  var el=$('#pipeline'); if(!el) return;
  var t=T(), p=Call.pipe, c=esc(cg());
  function stg(num,title,sub,state){ return '<div class="stg '+state+'"><div class="stg-dot">'+(state==='done'?icon('check'):n(num))+'</div><div class="stg-t">'+title+'</div><div class="stg-s">'+sub+'</div></div>'; }
  var s1=p===0?'':p>=2?'done':'live', s2=p===0?'':p>=2?'done':(Call.feed.length>1?'live':''), s3=p===2?'live':p===3?'done':'', s4=p===3?'done':'';
  var stages='<div class="stages">'+
    stg(1,x('Conversation','কথোপকথন'),x('Warm Bangla chat, personal memories, empathy','আন্তরিক বাংলা আলাপ, ব্যক্তিগত স্মৃতি, সহমর্মিতা'),s1)+
    stg(2,x('Signal extraction','সংকেত শনাক্তকরণ'),x('Recall, orientation, routine, mood','স্মৃতি, সময়জ্ঞান, রুটিন, মন'),s2)+
    stg(3,x('Baseline comparison','বেসলাইনের সাথে তুলনা'),x('Against '+t.his+' own usual pattern','তাঁর নিজের স্বাভাবিক ধরনের সাথে'),s3)+
    stg(4,x('Family report','পরিবারের রিপোর্ট'),x('A short summary for '+c, esc(poss(cg()))+' জন্য ছোট সারসংক্ষেপ'),s4)+'</div>';
  var body;
  if(!Call.feed.length){
    body='<div class="empty"><p>'+x('Ring the phone to start. As '+esc(t.en)+' answers, Apon turns the chat into a few simple signals, compares them with '+t.his+' usual pattern and writes '+c+' a short note.','ফোনে রিং দিয়ে শুরু করুন। '+esc(t.bn)+' যখন উত্তর দেন, আপন আলাপটিকে কয়েকটি সহজ সংকেতে রূপ দেয়, তাঁর স্বাভাবিক ধরনের সাথে তুলনা করে, আর '+esc(poss(cg()))+' জন্য একটি ছোট নোট লেখে।')+'</p><p class="small muted">'+x('Nothing here is a test score or a diagnosis. It\u2019s a way of noticing change early.','এখানে কিছুই পরীক্ষার নম্বর বা রোগ নির্ণয় নয়। এটি আগেভাগে পরিবর্তন লক্ষ করার একটি উপায়।')+'</p></div>';
  } else {
    body='<div class="feed-h"><span>'+x('Signals noticed','লক্ষ করা সংকেত')+'</span><span>'+n(Call.feed.length)+'</span></div><ul class="feed" id="feed">'+
      Call.feed.map(function(f,i){ return '<li'+(i>=Call.feedSeen?' class="fresh"':'')+'><span class="tag">'+esc(x(f.cat,CAT_BN[f.cat]||f.cat))+'</span><span>'+esc(x(f.en,f.bn))+'</span><span class="dot '+f.tone+'"></span></li>'; }).join('')+'</ul>';
  }
  var cmp='';
  if(p===2) cmp='<div class="cmp"><div class="working"><span class="spin" aria-hidden="true"></span>'+x('Comparing with '+esc(t.en)+'\u2019s baseline\u2026', esc(poss(t.bn))+' বেসলাইনের সাথে তুলনা চলছে\u2026')+'</div></div>';
  if(p===3 && Call.result){
    var r=Call.result;
    cmp='<div class="cmp"><h4>'+x('Today against '+t.his+' usual','আজ বনাম তাঁর স্বাভাবিক')+'</h4><table><thead><tr><th>'+x('Signal','সংকেত')+'</th><th>'+x('Today','আজ')+'</th><th>'+x('Usual','স্বাভাবিক')+'</th><th>'+x('Status','অবস্থা')+'</th></tr></thead><tbody>'+
      METRICS.map(function(m){ var v=m.get(r), st=dailySt(m,v); return '<tr><td>'+mlabel(m)+'</td><td>'+esc(m.day(v))+'</td><td>'+esc(m.fmt(m.base))+'</td><td><span class="pill '+st+'">'+(st==='ok'?x('Within usual','স্বাভাবিকের মধ্যে'):x('Different today','আজ আলাদা'))+'</span></td></tr>'; }).join('')+
      '</tbody></table><p class="small" style="margin:12px 0 0;color:var(--ink-2)">'+x('One day is never treated as a trend. Weekly patterns are on the Insights screen.','এক দিনকে কখনো প্রবণতা ধরা হয় না। সাপ্তাহিক ধরন বিশ্লেষণ পাতায় আছে।')+'</p></div>';
  }
  el.innerHTML='<div class="pipe-head"><h3 class="h3">'+x('Behind the call','কলের পেছনে')+'</h3><span class="small muted">'+x('Simulated AI workflow','সিমুলেটেড এআই কার্যপ্রবাহ')+'</span></div>'+stages+body+cmp+
    '<div class="prod">'+icon('shield')+'<p>'+x('In a real product, a language model would handle the warm conversation and summaries, while separate, testable engines score recall and orientation and compare trends with the baseline. Here every step is scripted.','বাস্তব পণ্যে একটি ভাষা মডেল আন্তরিক আলাপ ও সারসংক্ষেপ সামলাবে, আর আলাদা, পরীক্ষাযোগ্য ইঞ্জিন স্মৃতি ও সময়জ্ঞান মূল্যায়ন করবে এবং বেসলাইনের সাথে প্রবণতা মেলাবে। এখানে প্রতিটি ধাপ আগে থেকে লেখা।')+'</p></div>';
  Call.feedSeen=Call.feed.length;
  var fe=$('#feed'); if(fe) fe.scrollTop=fe.scrollHeight;
}

/* =========================================================
   (f) Language, navigation, toast, events, init
   ========================================================= */
function applyShell(){
  document.documentElement.lang = LANG==='bn'?'bn':'en';
  document.title = x('Apon (আপন) | Companion calls for families','আপন (Apon) | পরিবারের জন্য সঙ্গী কল');
  $$('[data-en][data-bn]').forEach(function(el){ el.textContent = LANG==='bn'?el.getAttribute('data-bn'):el.getAttribute('data-en'); });
  $$('.lang [data-l]').forEach(function(b){ var on=b.getAttribute('data-l')===LANG; b.classList.toggle('on',on); b.setAttribute('aria-pressed',String(on)); });
  var w=$('#who-name'); if(w) w.textContent=cg();
  var wa=$('#who-av'); if(wa) wa.textContent=cg().charAt(0);
}
function setLang(l){
  if(l===LANG) return;
  LANG = l==='bn'?'bn':'en';
  try{ window.localStorage.setItem(LANG_KEY,LANG); }catch(e){}
  applyShell(); renderHome(); renderPatient(); renderMemory(); renderInsights();
  /* Re-render the call screen without interrupting a call in progress */
  var keepScroll=Call.state;
  renderCallView();
  if(keepScroll==='active'||keepScroll==='ending'){ var cc=$('#cclock'); if(cc) cc.textContent=fmtClock(Call.shown); }
  toast(x('Switched to English.','বাংলা চালু হয়েছে।'));
}
var VIEWS=['home','call','patient','memory','insights'];
function show(v,noScroll){
  if(VIEWS.indexOf(v)<0) v='home';
  $$('.view').forEach(function(el){ el.classList.toggle('on', el.id==='view-'+v); });
  $$('.tabs [data-go], .bnav [data-go]').forEach(function(b){ var on=b.getAttribute('data-go')===v; b.classList.toggle('on',on); if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if(!noScroll) window.scrollTo(0,0);
  try{ history.replaceState(null,'','#'+v); }catch(e){}
}
var toastTimer=null, toastUndo=null;
function toast(msg,undo){
  var el=$('#toast'); if(!el) return;
  toastUndo=undo||null;
  el.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button data-action="toast-undo">'+x('Undo','ফিরিয়ে আনুন')+'</button>':'');
  el.classList.add('on'); clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.classList.remove('on'); toastUndo=null; }, undo?6000:3400);
}
function renderAll(){ applyShell(); renderHome(); renderCallView(); renderPatient(); renderMemory(); renderInsights(); }
function scrollToToday(){ setTimeout(function(){ var el=$('#today'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },60); }
function val(id){ var el=$('#'+id); return el?el.value:''; }

function addInterest(){
  var inp=$('#interest-in'); if(!inp) return; var v=inp.value.trim();
  if(!v){ inp.focus(); return; }
  if(S.interests.some(function(q){ return tx(q).toLowerCase()===v.toLowerCase() || (q.en&&q.en.toLowerCase()===v.toLowerCase()); })){ toast(x(v+' is already on the list.', v+' ইতিমধ্যে তালিকায় আছে।')); return; }
  S.interests.push({en:v.slice(0,40),bn:v.slice(0,40)}); save(); renderPatient(); var nn=$('#interest-in'); if(nn) nn.focus(); toast(x('Interest added.','আগ্রহ যোগ হয়েছে।'));
}
function saveProfile(){
  var name=val('f-name').trim(), age=parseInt(val('f-age'),10), term=val('f-term'), city=val('f-city').trim(), living=val('f-living').trim(), time=val('f-time')||'10:00';
  if(!name){ editErr=x('Add a name so Apon knows who it is calling.','একটি নাম দিন, যাতে আপন জানে কাকে ফোন করছে।'); renderPatient(); return; }
  if(!(age>=45 && age<=110)){ editErr=x('Enter an age between 45 and 110.','৪৫ থেকে ১১০-এর মধ্যে বয়স লিখুন।'); renderPatient(); return; }
  var sfx = LANG==='bn'?'Bn':'';           /* edit the fields for the language being shown */
  S.profile['name'+sfx]=name.slice(0,60);
  if(city) S.profile['city'+sfx]=city.slice(0,60);
  if(living) S.profile['living'+sfx]=living.slice(0,400);
  S.profile.age=age; S.profile.term=TERMS[term]?term:'abba'; S.profile.callTime=time;
  editing=false; editErr=''; save(); freshCall('idle'); renderAll(); show('patient',true); toast(x('Profile saved.','প্রোফাইল সংরক্ষণ হয়েছে।'));
}
function saveMemory(){
  var type=val('m-type'), title=val('m-title').trim(), role=val('m-role').trim(), starter=val('m-starter').trim(), detail=val('m-detail').trim();
  if(!title){ mErr=x('Add a name or title for this memory.','এই স্মৃতির একটি নাম বা শিরোনাম দিন।'); keepForm(type,title,role,starter,detail); return; }
  if(!detail){ mErr=x('Add a few details so Apon can talk about it naturally.','কিছু বিস্তারিত লিখুন, যাতে আপন স্বাভাবিকভাবে এ নিয়ে কথা বলতে পারে।'); keepForm(type,title,role,starter,detail); return; }
  var m={id:'m-'+Date.now().toString(36),type:TYPE_LABEL[type]?type:'story',title:title.slice(0,60),detail:detail.slice(0,400),
    by:'Added by '+S.profile.caregiver+', today', byBn:(S.profile.caregiverBn||S.profile.caregiver)+' আজ যোগ করেছেন'};
  if(m.type==='family') m.role=role.slice(0,40)||x('Family','পরিবার');
  if(m.type==='hobby'){ m.like=m.title; m.likeBn=m.title; }
  if(starter) m.starter=starter.slice(0,160);
  S.memories.unshift(m); mForm=false; mErr=''; if(mFilter!=='all'&&mFilter!==m.type) mFilter='all';
  save(); renderMemory(); renderHome();
  toast(x('Memory saved. Pin it to hear Apon use it on the next call.','স্মৃতি সংরক্ষণ হয়েছে। পরের কলে আপন এটি ব্যবহার করবে, যদি পিন করেন।'));
}
function keepForm(type,title,role,starter,detail){
  renderMemory();
  var set=function(id,v){ var el=$('#'+id); if(el) el.value=v; };
  set('m-type',type); set('m-title',title); set('m-role',role); set('m-starter',starter); set('m-detail',detail);
}

document.addEventListener('click',function(e){
  var go=e.target.closest('[data-go]');
  if(go){ show(go.getAttribute('data-go')); return; }
  var el=e.target.closest('[data-action]'); if(!el) return;
  var a=el.getAttribute('data-action');
  switch(a){
    case 'lang': setLang(el.getAttribute('data-l')); break;
    case 'hero-call': show('call'); ring(); break;
    case 'hero-answer': show('call'); answer(); break;
    case 'hero-decline': toast(x('Apon will try again in 30 minutes.','আপন ৩০ মিনিট পর আবার চেষ্টা করবে।')); break;
    case 'to-today': scrollToToday(); break;
    case 'done': S.done=true; save(); renderHome(); toast(x('Marked as done.','সম্পন্ন হিসেবে চিহ্নিত হয়েছে।')); break;
    case 'undo-done': S.done=false; save(); renderHome(); break;
    case 'remind': toast(x('Reminder set for 8:00 PM. This is a demo, so no notification will be sent.','রাত ৮টার জন্য রিমাইন্ডার সেট হয়েছে। এটি ডেমো, তাই কোনো নোটিফিকেশন যাবে না।')); break;
    case 'ring': ring(); break;
    case 'answer': answer(); break;
    case 'decline': decline(); break;
    case 'hangup': hangup(); break;
    case 'reply': reply(parseInt(el.getAttribute('data-i'),10)); break;
    case 'auto':
      Call.auto=!Call.auto; renderCtrls(); renderReplies();
      if(Call.auto && Call.awaiting) later(pickAuto,900);
      if(Call.auto && Call.state==='ringing') later(answer,1200);
      break;
    case 'scen': Call.scen=parseInt(el.getAttribute('data-i'),10)||0; renderCtrls(); renderReplies(); break;
    case 'reset-call': freshCall('idle'); renderPhone(); renderPipeline(); break;
    case 'see-report': show('home'); scrollToToday(); break;
    case 'edit-profile': editing=true; editErr=''; renderPatient(); var f=$('#f-name'); if(f) f.focus(); break;
    case 'cancel-edit': editing=false; editErr=''; renderPatient(); break;
    case 'save-profile': saveProfile(); break;
    case 'add-interest': addInterest(); break;
    case 'del-interest':
      var i=parseInt(el.getAttribute('data-i'),10), removed=S.interests[i];
      S.interests.splice(i,1); save(); renderPatient();
      toast(x(tx(removed)+' removed.', tx(removed)+' সরানো হয়েছে।'),function(){ S.interests.splice(i,0,removed); save(); renderPatient(); });
      break;
    case 'mfilter': mFilter=el.getAttribute('data-f'); renderMemory(); break;
    case 'open-mem': mForm=true; mErr=''; renderMemory(); var mt=$('#m-title'); if(mt) mt.focus(); break;
    case 'close-mem': mForm=false; mErr=''; renderMemory(); break;
    case 'save-mem': saveMemory(); break;
    case 'pin':
      var id=el.getAttribute('data-id'), wasPinned=S.pinned===id;
      S.pinned = wasPinned?null:id; save(); renderMemory(); renderHome();
      if(!wasPinned){ var mm=S.memories.filter(function(q){return q.id===id;})[0], nm=mm?mf(mm,'title'):''; toast(x('Apon will bring up \u201C'+nm+'\u201D on the next call.','পরের কলে আপন \u201C'+nm+'\u201D নিয়ে কথা বলবে।')); }
      break;
    case 'del-mem':
      var did=el.getAttribute('data-id'), idx=-1;
      S.memories.forEach(function(q,k){ if(q.id===did) idx=k; });
      if(idx<0) break;
      var gone=S.memories.splice(idx,1)[0], wasPin=S.pinned===did, gt=mf(gone,'title');
      if(wasPin) S.pinned=null;
      save(); renderMemory(); renderHome();
      toast(x('\u201C'+gt+'\u201D removed.','\u201C'+gt+'\u201D সরানো হয়েছে।'),function(){ S.memories.splice(idx,0,gone); if(wasPin) S.pinned=did; save(); renderMemory(); renderHome(); });
      break;
    case 'toast-undo': if(toastUndo){ var u=toastUndo; toastUndo=null; u(); } $('#toast').classList.remove('on'); break;
    case 'reset-demo':
      S=seed(); save(); editing=false; mForm=false; mFilter='all'; Call.auto=false; Call.scen=0; freshCall('idle'); renderAll(); show('home'); toast(x('Demo data reset.','ডেমো ডেটা রিসেট হয়েছে।'));
      break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter') return;
  if(e.target && e.target.id==='interest-in'){ e.preventDefault(); addInterest(); }
});
setInterval(function(){ if(Call.state==='idle'){ var s=$('#screen .lock-time'); if(s) s.textContent=clockPlain(); } },20000);

renderAll();
var start=(location.hash||'').replace('#','');
show(VIEWS.indexOf(start)>-1?start:'home');
})();
</script>
